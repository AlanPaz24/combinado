<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería — Combinado FC</title>
  <meta name="description" content="Fotos de Combinado FC: partidos, festejos y entrenamientos.">
  <meta name="theme-color" content="#0a0d0b">
  <link rel="canonical" href="https://alanpaz24.github.io/combinado/galeria.html">
  <meta property="og:title" content="Galería — Combinado FC">
  <meta property="og:description" content="Los mejores momentos del club.">
  <meta property="og:image" content="https://alanpaz24.github.io/combinado/img/logo/escudo.png">
  <meta property="og:url" content="https://alanpaz24.github.io/combinado/galeria.html">
  <meta property="og:type" content="website">

  <link rel="icon" href="img/logo/escudo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<body data-pagina="galeria">

  <header class="cabecera" id="cabecera"></header>

  <main>
    <section class="banner">
      <div class="contenedor">
        <span>Momentos</span>
        <h1>Galería</h1>
        <p>Los mejores momentos del club, dentro y fuera de la cancha.</p>
      </div>
    </section>

    <section class="seccion">
      <div class="contenedor">
        <div class="barra-album" id="barra-album" hidden></div>
        <div class="grid-albumes" id="grid-albumes"></div>
        <div class="centro" id="ver-todas" hidden></div>
        <div class="grid-galeria" id="grid-galeria"></div>
      </div>
    </section>
  </main>

  <!-- Visor a pantalla completa -->
  <dialog class="visor" id="visor" aria-label="Visor de fotos"></dialog>

  <footer class="pie" id="pie"></footer>

  <script src="js/comun.js" defer></script>
  <script src="js/galeria.js" defer></script>
</body>
</html>
